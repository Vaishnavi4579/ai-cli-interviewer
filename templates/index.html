{% extends "base.html" %}

{% block content %}
<div class="card">
  <h2>Upload Your Resume</h2>
  <p>Upload your resume and start your AI-powered mock interview.</p>

  <form action="/interview" method="POST" enctype="multipart/form-data">

    <div class="upload-area">
      <label for="resume">Select Resume (PDF or DOCX)</label>
      <input
        type="file"
        id="resume"
        name="resume"
        accept=".pdf,.docx"
        required
      />
    </div>

    <button type="submit" class="button">
      Start Interview
    </button>

  </form>
</div>
{% endblock %}
